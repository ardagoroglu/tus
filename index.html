/* Beril'in Kedili Bahçesi
   Düzen fikri: tek sütun, önce "sıradaki iş"; bahçe sahnesi ilerlemeyi gösterir. Cesur yer yalnızca bahçe ve kediler, geri kalan her şey sakin. */
:root {
  --zemin: #F5FAF0;
  --zemin2: #EAF4E3;
  --kart: #FFFFFF;
  --murekkep: #33294A;
  --soluk: #6E6785;
  --cizgi: #E1E9D8;
  --vurgu: #C93B72;        /* şakayık: düğmeler, bağlantılar */
  --vurgu-acik: #FFE3EE;
  --nane: #2E9E79;         /* tamamlandı */
  --nane-acik: #DDF4E9;
  --gunes: #FFC43D;
  --gunes-acik: #FFF2CC;
  --lavanta: #8B6FD6;
  --lavanta-acik: #EEE7FC;
  --gok: #DFF1FB;
  --gok2: #F7FCEB;
  --tepe1: #BFE5B0;
  --tepe2: #9FD69A;
  --gunduz: inline; --gece: none; --yildiz: 0; --bulut: .9;   /* sahne süsleri */
  --vurgu-yazi: #FFFFFF;   /* vurgu zemini üstündeki yazı */
  --nane-yazi: #FFFFFF;
  --amber-yazi: #8A5F00;
  --golge: 0 1px 2px rgba(51, 41, 74, .05), 0 8px 24px rgba(51, 41, 74, .07);
  --baslik: "Baloo 2", "Nunito", "Trebuchet MS", "Segoe UI", sans-serif;
  --govde: "Nunito", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --elyazi: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --r: 20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-tema="gunduz"]) {
    --zemin: #1A1830; --zemin2: #221F3D; --kart: #2A2749; --murekkep: #F2EDFB; --soluk: #B4ACCB; --cizgi: #3B3763;
    --vurgu: #FF8DB5; --vurgu-acik: #4A2A4C; --nane: #6FDDB4; --nane-acik: #213F45; --gunes: #FFD166; --gunes-acik: #4A4030;
    --lavanta: #BBA4F5; --lavanta-acik: #362F63; --gok: #262350; --gok2: #1F2A4A; --tepe1: #2F5B56; --tepe2: #27504D;
    --vurgu-yazi: #2A1230; --nane-yazi: #12301F; --amber-yazi: #FFD166;
    --gunduz: none; --gece: inline; --yildiz: .9; --bulut: .12;
    --golge: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-tema="gunduz"]), :root[data-tema="gece"] {
  --zemin: #1A1830; --zemin2: #221F3D; --kart: #2A2749; --murekkep: #F2EDFB; --soluk: #B4ACCB; --cizgi: #3B3763;
  --vurgu: #FF8DB5; --vurgu-acik: #4A2A4C; --nane: #6FDDB4; --nane-acik: #213F45; --gunes: #FFD166; --gunes-acik: #4A4030;
  --lavanta: #BBA4F5; --lavanta-acik: #362F63; --gok: #262350; --gok2: #1F2A4A; --tepe1: #2F5B56; --tepe2: #27504D;
    --vurgu-yazi: #2A1230; --nane-yazi: #12301F; --amber-yazi: #FFD166;
    --gunduz: none; --gece: inline; --yildiz: .9; --bulut: .12;
  --golge: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--zemin); color: var(--murekkep);
  font: 500 16px/1.5 var(--govde); -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  overflow-x: hidden;
}
p, small, span, b, h1, h2, h3, summary, button { overflow-wrap: anywhere; }
h1, h2, h3 { font-family: var(--baslik); line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.7rem; font-weight: 700; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--lavanta); outline-offset: 2px; border-radius: 10px; }
a { color: var(--vurgu); }
.sayi { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---------- üst şerit ---------- */
.ust { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--zemin) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
/* Sayfa bir uygulamanın üst çubuğunun altına çiziliyorsa (güvenli alan), başlık çubuğun altında durur ve üstündeki şeridi kapatır */
.ust::before { content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: env(safe-area-inset-top, 0px); background: var(--zemin); }
.ust-ic { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.marka { display: flex; align-items: center; gap: 8px; font: 700 1.12rem/1 var(--baslik); margin-right: auto; white-space: nowrap; }
.marka svg { flex: none; }
.cip-bilgi { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--kart); box-shadow: var(--golge); font-size: .84rem; font-weight: 700; white-space: nowrap; }
.cip-bilgi b { font-family: var(--baslik); font-size: 1rem; }
.arda-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; background: var(--vurgu-acik); color: var(--vurgu); font: 600 1.15rem/1 var(--elyazi); white-space: nowrap; }
.esit-nokta { width: 10px; height: 10px; border-radius: 50%; background: var(--cizgi); flex: none; }
.esit-nokta.tamam { background: var(--nane); } .esit-nokta.suruyor { background: var(--gunes); } .esit-nokta.hata { background: #E5484D; }

/* ---------- gezinme ---------- */
.gez { display: flex; gap: 4px; }
.gez button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 14px; border-radius: 16px; font-size: .78rem; font-weight: 700; color: var(--soluk); min-width: 64px; }
.gez button svg { width: 24px; height: 24px; }
.gez button[aria-current="page"] { color: var(--vurgu); background: var(--vurgu-acik); }
@media (max-width: 759px) {
  .gez { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; justify-content: space-around; background: var(--kart); border-top: 1px solid var(--cizgi); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .gez button { flex: 1; }
  .ust .cip-bilgi.genis { display: none; }
}
@media (min-width: 760px) {
  .gez { position: fixed; top: calc(7px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 25; }
  .gez button { flex-direction: row; gap: 7px; font-size: .9rem; padding: 8px 14px; min-width: 0; }
  .gez button svg { width: 20px; height: 20px; }
  .ust-ic { min-height: 54px; }
}

/* ---------- sayfa ---------- */
.sayfa { max-width: 1080px; margin: 0 auto; padding: 8px 16px calc(96px + env(safe-area-inset-bottom)); display: grid; gap: 16px; }
.iki { display: grid; gap: 16px; align-items: start; }
@media (min-width: 960px) { .iki { grid-template-columns: minmax(0, 1fr) 380px; } .iki > .ana { order: 1; } .iki > .yan { order: 2; position: sticky; top: 70px; } }
.sutun { display: grid; gap: 16px; min-width: 0; }
.kart { background: var(--kart); border-radius: var(--r); box-shadow: var(--golge); padding: 18px; min-width: 0; }
.kart > * + * { margin-top: 12px; }
.ipucu { color: var(--soluk); font-size: .92rem; }
.etiket { font: 700 .74rem/1 var(--govde); letter-spacing: .06em; text-transform: uppercase; color: var(--soluk); }

/* ---------- sahne (bahçe özeti) ---------- */
.sahne { position: relative; border-radius: 26px; overflow: hidden; box-shadow: var(--golge); background: linear-gradient(180deg, var(--gok) 0%, var(--gok2) 78%); height: 200px; container-type: inline-size; }
.sahne::before { content: ""; position: absolute; inset: 0 0 42% 0; opacity: var(--yildiz); pointer-events: none;
  background: radial-gradient(1.3px 1.3px at 9% 62%, #fff 98%, transparent), radial-gradient(1.6px 1.6px at 24% 20%, #fff 98%, transparent), radial-gradient(1.2px 1.2px at 38% 78%, #fff 98%, transparent), radial-gradient(1.5px 1.5px at 52% 12%, #fff 98%, transparent), radial-gradient(1.2px 1.2px at 63% 55%, #fff 98%, transparent), radial-gradient(1.7px 1.7px at 76% 30%, #fff 98%, transparent), radial-gradient(1.2px 1.2px at 88% 70%, #fff 98%, transparent), radial-gradient(1.4px 1.4px at 95% 16%, #fff 98%, transparent); }
.sahne .gokcismi { position: absolute; left: 20px; top: 12px; width: 50px; height: 50px; }
.sahne .bulutlar { position: absolute; right: 16px; bottom: 92px; width: 104px; height: auto; }
.sahne .tepeler { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 88px; display: block; }
.sahne .cicek-sira { position: absolute; left: 116px; right: 10px; bottom: 12px; height: 58px; display: flex; align-items: flex-end; }
.sahne .cicek-sira svg { width: 32px; height: 52px; flex: none; overflow: visible; }
.sahne .cicek-sira svg:nth-last-child(n+8) { display: none; }
@container (min-width: 600px) { .sahne .cicek-sira svg:nth-last-child(n+8) { display: block; } .sahne .cicek-sira svg { width: 36px; height: 58px; } }
.balon { position: absolute; left: 118px; top: 14px; right: 14px; max-width: 330px; background: var(--kart); border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-weight: 700; box-shadow: var(--golge); }
.balon small { display: block; font-weight: 600; color: var(--soluk); margin-top: 2px; }
.sahne .kedi-yer { position: absolute; left: 10px; bottom: 6px; }
.t-tepe1 { fill: var(--tepe1); } .t-tepe2 { fill: var(--tepe2); } .t-bulut { fill: var(--kart); opacity: var(--bulut); }
.sus-gunduz { display: var(--gunduz); } .sus-gece { display: var(--gece); }
